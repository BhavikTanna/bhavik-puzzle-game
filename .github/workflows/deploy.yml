name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required for AWS OIDC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Corepack pins Yarn to the version in package.json's packageManager field.
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      # --immutable fails if yarn.lock would change, so CI cannot drift.
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      # tsx runs the CDK app without typechecking it, so check it explicitly.
      - run: yarn infra:typecheck

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Set the variables below under Settings > Environments > production.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Builds the site, then deploys the stack — which uploads the build and
      # invalidates CloudFront as part of the same change.
      - run: yarn deploy --require-approval never
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
          GITHUB_REPO: ${{ github.repository }}
          DOMAIN_NAMES: ${{ vars.DOMAIN_NAMES }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
